name: check

# Runs on every push and pull request, before the daily tracker ever fires.
# Two guards:
#   - the budget: a config edit that would overspend the free API plan fails
#     here, not on the invoice
#   - the design system: the pages are linted against the exact sc.css they
#     pin — namespace squats, unknown sc- classes and raw colour fail; the
#     policy lives in tools/consumer_lint_ci.mjs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Tests
        env:
          AUTODEV_API_KEY: test-key-not-used
        run: python -m unittest discover -s tests -t . -v
      - name: Config and outputs are valid JSON
        run: |
          python -c "import json; json.load(open('targets.json')); print('targets.json ok')"
          python -c "import json; json.load(open('docs/data.json')); print('data.json ok')"
      - name: Call plan
        env:
          AUTODEV_API_KEY: test-key-not-used
        run: |
          python -c "
          import Tracking as T
          today, worst, avg = T.planned_calls()
          print(f'{len(T.TARGETS)} targets | today {today} | worst {worst}/{T.BUDGET} | '
                f'avg {avg:.1f}/day = {avg*30.5:,.0f}/month of {T.MONTHLY:,} '
                f'({avg*30.5/T.MONTHLY:.0%} of plan)')
          "

  consumer-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Lint the pages against the design system they pin
        run: |
          PIN=$(grep -oEm1 'design-system@[^/"]+' docs/index.html | cut -d@ -f2)
          echo "pages pin design-system@$PIN"
          git clone --depth 1 --branch "$PIN" https://github.com/spicyChicken59/design-system /tmp/design-system \
            || { git clone https://github.com/spicyChicken59/design-system /tmp/design-system \
                 && git -C /tmp/design-system checkout "$PIN"; }
          node tools/consumer_lint_ci.mjs /tmp/design-system docs/index.html docs/how.html
