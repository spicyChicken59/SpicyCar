name: SpicyCar daily

on:
  schedule:
    - cron: "0 11 * * *"
  # Dispatch is for a run that DIED PARTWAY and left the day incomplete —
  # nothing else. Every dispatch on a day already fetched re-bills that whole
  # day at full price: over nine days that habit spent 529 calls, about 1,790 a
  # month against a 1,000-call tier, while the pre-flight guard reported 30/day
  # and approved every one, because it reads the PLAN and not the ledger.
  #
  # Tracking.py refuses such a run before spending anything (exit 3), and the
  # job then does the free thing instead of painting itself red: it rebuilds
  # REPORT.md and docs/data.json from the snapshot already on disk, which is
  # what a re-run is almost always actually for. So a dispatch on an
  # already-fetched day SUCCEEDS and costs nothing. Tick allow_refetch below
  # only when a COMPLETED run reported sources failed after retry and the
  # day is worth fetching again in full — a run that died mid-fetch wrote no
  # rows, so it never reaches the guard and simply runs again.
  workflow_dispatch:
    inputs:
      allow_refetch:
        description: "Re-fetch a day already fetched, all of it (only when a completed run reported sources failed after retry; a run that died mid-fetch just runs again)"
        type: boolean
        default: false

permissions:
  contents: write

# One tracker at a time: an overlapping manual run would double the day's
# API spend and race the other run's push.
concurrency:
  group: daily-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    # A dead or slow API is the case this has to survive. Every request waits
    # up to 45s and is retried once, so a day where every call times out costs
    # 32 calls x 2 attempts x 45s = 48 minutes of waiting — and a job killed at
    # 15 minutes has BILLED everything it spent and written nothing, so the
    # guard cannot even tell tomorrow's run that the day was attempted. 60
    # leaves room for that worst case plus the commit; a healthy run finishes
    # in under two.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run tracker
        id: tracker
        env:
          AUTODEV_API_KEY: ${{ secrets.AUTODEV_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          BUYER_HOME_ZIP: ${{ secrets.BUYER_HOME_ZIP }}
          # Empty on the cron path, so the guard is live for every scheduled run.
          ALLOW_REFETCH: ${{ inputs.allow_refetch && '1' || '' }}
        # Exit 3 means "today was already fetched, nothing spent" — a saving,
        # not a failure. The usual reason to dispatch this workflow is wanting
        # fresh outputs after a config or code change, and that costs nothing,
        # so do exactly that instead of painting the run red.
        run: |
          set +e
          python Tracking.py
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then
            echo "::notice::Today was already fetched. Regenerating REPORT.md and docs/data.json from the snapshot on disk — 0 API calls."
            python tools/rebuild_outputs.py
          elif [ "$rc" != "0" ]; then
            exit $rc
          fi
      - name: Commit the record, whatever happened to the outputs
        # data/ is the part that cannot be re-made. snapshots.csv holds rows
        # the listings API will never serve again, and spend.json is the only
        # count of what the month has cost — and both were thrown away by any
        # run that crashed after the fetch loop, because the commit step below
        # only runs on success. A crash in build_outputs() therefore burned up
        # to 32 calls and left no record that it had: the next day's budget
        # check read a month that looked cheaper than it was.
        #
        # Staged on its own, and data/ ONLY. A blanket always() on the step
        # below would stage docs/ and REPORT.md too, and main() writes
        # REPORT.md before docs/data.json — so a crash between those two lines
        # would push a report describing a snapshot that is not there. data/ is
        # safe on every path: a crash inside the fetch loop leaves it
        # untouched, and a crash after write_rows commits a day whose fetching
        # had already finished, which is also what lets tomorrow's guard exit 3
        # and rebuild the outputs for free.
        #
        # And ONLY when the tracker did not succeed. A bare always() ran this
        # on every good day too, ahead of the step below, and split each
        # snapshot into two commits — "record" carrying data/, then "snapshot"
        # carrying docs/ and REPORT.md — for a day that had lost nothing. The
        # step below already commits data/ with the outputs on success; this
        # one exists for the path where that step never runs.
        if: always() && steps.tracker.conclusion != 'success'
        run: |
          git config user.name  "tracker"
          git config user.email "actions@github.com"
          git add data
          git diff --staged --quiet && exit 0
          git commit -m "record $(date -u +%F)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          git push
      - name: Commit outputs
        # The listings API is live-only: a rejected push would discard a
        # snapshot that can never be re-fetched. Rebase onto whatever landed
        # on main during the run and retry. The outputs CAN conflict with
        # what landed: an owner who edits targets.json and runs
        # tools/rebuild_outputs.py — the thing the exit-3 guard tells them to
        # do — commits the same REPORT.md and docs/data.json this step
        # commits, and the rebase then stops in both files, the -e shell
        # aborts mid-rebase, the day's snapshot never reaches main and the
        # safety-net artifact carries conflict markers. Those two files are
        # full regenerations from data/, so on a conflict the tracker's fresh
        # copy wins and the owner's source edit, which is not in the
        # conflict, survives the rebase untouched. Only those two: a conflict
        # in data/ itself means two fetches of one day, which nobody should
        # resolve on a runner, and the loud abort stays. Never `reset --soft`:
        # that commits the pre-fetch tree and reverts the owner's edit
        # silently while the push reports success.
        run: |
          git config user.name  "tracker"
          git config user.email "actions@github.com"
          git add data docs REPORT.md
          git diff --staged --quiet && exit 0
          git commit -m "snapshot $(date -u +%F)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || {
              git checkout --theirs -- REPORT.md docs/data.json && git add REPORT.md docs/data.json && GIT_EDITOR=true git rebase --continue
            }
          done
          git push
      - name: Keep the snapshot if the push still failed
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: snapshot-${{ github.run_id }}
          path: |
            data/
            docs/data.json
            REPORT.md
          retention-days: 7
